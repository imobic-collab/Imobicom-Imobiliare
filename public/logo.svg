<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <!-- House roof -->
  <g fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof left -->
    <line x1="70" y1="75" x2="180" y2="20" />
    <!-- Roof right -->
    <line x1="180" y1="20" x2="290" y2="75" />
    <!-- Left wall -->
    <line x1="85" y1="68" x2="85" y2="85" />
    <!-- Right wall -->
    <line x1="275" y1="68" x2="275" y2="85" />
    <!-- Chimney -->
    <rect x="210" y="28" width="18" height="22" fill="#1a1a1a" stroke="none" rx="1"/>
  </g>
  <!-- Window grid -->
  <rect x="163" y="48" width="34" height="34" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="180" y1="48" x2="180" y2="82" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="163" y1="65" x2="197" y2="65" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Decorative lines + AGENȚIA IMOBILIARĂ -->
  <line x1="30" y1="100" x2="90" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="270" y1="100" x2="330" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="180" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="3" fill="#1a1a1a" font-weight="600">AGENȚIA IMOBILIARĂ</text>

  <!-- Gold line + tagline -->
  <line x1="30" y1="122" x2="90" y2="122" stroke="#c9a84c" stroke-width="1"/>
  <line x1="270" y1="122" x2="330" y2="122" stroke="#c9a84c" stroke-width="1"/>
  <text x="180" y="127" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="2" fill="#c9a84c" font-style="italic">VINDEM. NU DOAR PROMOVĂM.</text>

  <!-- Bottom: IMOBICOM -->
  <line x1="60" y1="148" x2="100" y2="148" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="260" y1="148" x2="300" y2="148" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="180" y="153" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="6" fill="#1a1a1a" font-weight="700">IMOBICOM</text>
</svg>
